<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscripciones y Registros</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="../assets/img/logo.svg" alt="Logo de tesoro perdido" class="logo" id="logo-dashboard">
            <div class="dashboard-profile">
                <!-- <div class="language-selector">
                    <img src="https://placehold.co/40x27" alt="Language Flag">
                    <div class="language">Español</div>
                </div> -->
                <div class="user-info">
                    <figure class="user-avatar">
                        <img src="" alt="">
                    </figure>
                    <div class="user-details">
                        <div class="user-name"></div>
                        <div class="user-role">Administrador</div>
                    </div>
                </div>

            </div>
        </div>
        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar">

                <div class="menu">
                    <div class="menu-item" id="dashboard-admin">Panel de Control</div>
                    <div class="menu-item" id="gestionPago-admin">Gestión de Pagos</div>
                    <div class="menu-item" id="seccionMonitores-admin">Monitores</div>
                    <div class="menu-item" id="inscripcionesRegistros-admin">Soporte</div>
                    <!-- <div class="menu-item" id="excursiones-admin">Excursiones</div> -->
                </div>
            </div>
            <div class="dashboard-menu">
                <!-- Dashboard Title -->
                <h3 class="dashboard-title">Inscripciones y Registros</h3>
                <!-- Activity Card -->
                <!-- <div class="menu-options">
                    <button class="button-options" id="btnRevisar">Revisar Inscripciones</button>
                    <button class="button-options" id="btnSoporte">Soporte</button>
                </div> -->
                <div class="menu-content">
                    <!-- <p class="menu-content-default">Selecciona una opción</p> -->
                    <div class="revisar-inscripciones" id="revisar-inscripciones" style="display: none;">
                        <p class="menu-content-default-title">Revisar Inscripciones</p>
                        <div class="nombre-inscripcion">Inscripción 1</div>
                        <div class="nombre-inscripcion">Inscripción 2</div>
                        <button id="button-revisar-inscripcion">Revisar</button>
                    </div>
                    <div class="respuesta-revision-inscripciones" id="respuesta-revision-inscripciones"
                        style="display: none;">
                        <p class="menu-content-default-title">Revisar Inscripciones</p>
                        <div id="visualizacion-pdf"></div>
                        <div class="caja-comentarios">
                            <p id="texto-responder-inscripcion">Comentarios</p>
                            <textarea name="respuesta-inscripcion" id="respuesta-inscripcion">

                            </textarea>
                            <div class="contenedor-botones-inscripcion">
                                <button class="button-crear-grupo" id="">Denegar</button>
                                <button class="button-crear-grupo" id="">Aceptar</button>
                            </div>
                        </div>
                    </div>
                    <div class="incidencia-pendiente" id="incidencia-pendiente"  style="display: flex;" >
                        <p class="menu-content-default-title">Soporte</p>
                        <button class="button-crear-grupo" id="btn-inscripciones-resueltas">Inscripciones Resueltas</button>
                    </div>
                    <div class="incidencia-resuelta" id="incidencia-resuelta"  style="display: none;" >
                        <p class="menu-content-default-title">Incidencias Resueltas</p>
                        <!-- <button class="button-crear-grupo" id="btn-volver-incidencias">Volver</button> -->
                    </div>
                    <div class="soporte-content" id="soporte-content" style="display: none;">
                        <div class="coment-box">
                            <p id="texto-responder-incidencia">Responder</p>
                            <div class="resumen-incidencia" id="resumen-incidencia"></div>
                            <form action="">
                                <textarea name="respuesta-soporte" id="respuesta-soporte">
                            </textarea>
                                <button class="button-crear-grupo" id="btn-responder-incidencia">Enviar</button>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
        <script src="inscripciones.js"></script>
</body>

</html>
