<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excursiones y Actividades</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="../assets/img/logo.svg" alt="Logo de tesoro perdido" class="logo" id="logo-excursiones">
            <div class="dashboard-profile">
                <div class="language-selector">
                    <img src="https://placehold.co/40x27" alt="Language Flag">
                    <div class="language">Español</div>
                </div>
                <div class="user-info">
                    <div class="user-avatar"></div>
                    <div class="user-details">
                        <div class="user-name">Isabel Martínez</div>
                        <div class="user-role">Administradora</div>
                    </div>
                </div>

            </div>
        </div>

        <div class="main-content">

            <div class="sidebar">

                        </thead>

                        <tbody>
                            <!-- Filas de horas -->
                            <tr>

                                <td class="editable"></td>
