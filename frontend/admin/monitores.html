<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitores</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="../assets/img/logo.svg" alt="Logo de tesoro perdido" class="logo" id="logo-monitores-admin">
            <div class="dashboard-profile">
                <div class="language-selector">
                    <img src="https://placehold.co/40x27" alt="Language Flag">
                    <div class="language">Español</div>
                </div>
                <div class="user-info">
                    <div class="user-avatar"></div>
                    <div class="user-details">
                        <div class="user-name">Isabel Martínez</div>
                        <div class="user-role">Administradora</div>
                    </div>
                </div>

            </div>
        </div>
        <!-- Main Content -->
        <div class="main-content">
            <!-- Sidebar -->
            <div class="sidebar">

                <div class="menu">
                    <div class="menu-item" id="dashboard-admin">Panel de Control</div>
                    <div class="menu-item" id="gestionPago-admin">Gestión de Pagos</div>
                    <div class="menu-item" id="seccionMonitores-admin">Monitores</div>
                    <div class="menu-item" id="inscripcionesRegistros-admin">Soporte</div>
                    <div class="menu-item" id="excursiones-admin">Excursiones</div>
                </div>
            </div>
            <div class="dashboard-menu">
                <!-- Dashboard Title -->
                <h3 class="dashboard-title">Monitores</h3>
                <!-- Activity Card -->
                <div class="menu-options">
                    <button class="button-options" id="btnCrearMonitores">Crear Monitores</button>
                    <button class="button-options" id="btnGrupos">Grupos</button>
                    <button class="button-options" id="btnListaMonitores">Lista de Monitores</button>
                </div>
                <div class="menu-content">
                    <div class="form-crear-monitor" id="form-crear-monitor" style="display: none;">
                        <form action="">
                            <div>
                                <label for="nombre-nuevo-monitor">Nombre*</label>
                                <input type="text" name="nombre-nuevo-monitor" id="nombre-nuevo-monitor"><span id="errorName"></span>
                            </div>
                            <div>
                                <label for="apellidos-nuevo-monitor">Apellidos*</label>
                                <input type="text" name="apellidos-nuevo-monitor" id="apellidos-nuevo-monitor"><span id="errorLastName"></span>
                            </div>
                            <div>
                                <label for="correo-nuevo-monitor">Correo electrónico*</label>
                                <input type="text" name="correo-nuevo-monitor" id="correo-nuevo-monitor"><span id="errorEmail"></span>
                            </div>
                            <div>
                                <label for="password-nuevo-monitor">Contraseña*</label>
                                <input type="password" name="password-nuevo-monitor" id="password-nuevo-monitor"><span id="errorPassword"></span>
                            </div>
                            <div>
                                <label for="dni-nuevo-monitor">DNI*</label>
                                <input type="text" name="dni-nuevo-monitor" id="dni-nuevo-monitor"><span id="errorDni"></span>
                            </div>
                            <div>
                                <label for="telf1-nuevo-monitor">Teléfono 1*</label>
                                <input type="text" name="telf1-nuevo-monitor" id="telf1-nuevo-monitor"><span id="errorPhone1"></span>
                            </div>
                            <div>
                                <label for="telf2-nuevo-monitor">Teléfono 2</label>
                                <input type="text" name="telf2-nuevo-monitor" id="telf2-nuevo-monitor"><span id="errorPhone2"></span>
                            </div>
                            <div>
                                <label for="description-nuevo-monitor">Descripción*</label>
                                <textarea name="description-nuevo-monitor" id="description-nuevo-monitor"></textarea><span id="errorDescription"></span>
                            </div>
                            <div>
                                <label for="nuevo-nombre-grupo">Nombre del grupo*</label>
                                <input name="nuevo-nombre-grupo" id="nuevo-nombre-grupo"></iid="errorDescriptionEditar"></span>
                            </div>
                        </form>
                        <div class="info-monitor-card">
                            <p>Información Monitor</p>
                            <img class="" src="https://placehold.co/200x200" alt="">
                            <button id="crear-monitor">Añadir monitor</button>
                        </div>
                    </div>
                    <div class="grupos" id="grupos" style="display: none;">
                        <!-- <button class="button-crear-grupo" id="btnCrearGrupo">Crear Grupo</button> -->
                        <!-- <div class="nombre-grupo">Grupo 1</div>
                        <div class="nombre-grupo">Grupo 2</div> -->
                    </div>
                    <div class="creacion-grupo" id="creacion-grupo" style="display: none;">
                        <h1>Añade a un alumno al grupo con solo un click</h1>
                        <div id="botones-crear-grupo">
                            <button class="button-crear-grupo" id="button-crear-grupo">Guardar cambios</button>
                            <div class="contenedor-listas">
                                
                                <div class="lista-grupo" id="lista-grupo">
                                </div>
                                <div class="lista-sin-grupo" id="lista-sin-grupo">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="lista-monitores" id="lista-monitores" style="display: none;">
                        <p class="menu-content-default-title" id="lista-monitor">Lista de Monitores</p>
                        <!-- <div class="nombre-monitor">Monitor 1</div>
                        <div class="nombre-monitor">Monitor 2</div>
                        <div class="nombre-monitor">Monitor 3</div>
                        <div class="nombre-monitor">Monitor 4</div> -->
                    </div>
                    <div class="form-crear-monitor" id="form-editar-monitor" style="display: none;">
                        <form action="">
                            <div>
                                <label for="nombre-editar-monitor">Nombre*</label>
                                <input type="text" name="nombre-editar-monitor" id="nombre-editar-monitor"><span id="errorNameEditar"></span>
                            </div>
                            <div>
                                <label for="apellidos-editar-monitor">Apellidos*</label>
                                <input type="text" name="apellidos-editar-monitor" id="apellidos-editar-monitor"><span id="errorLastNameEditar"></span>
                            </div>
                            <!-- <div>
                                <label for="correo-editar-monitor">Correo electrónico*</label>
                                <input type="text" name="correo-editar-monitor" id="correo-editar-monitor"><span id="errorEmailEditar"></span>
                            </div> -->
                            <div>
                                <label for="password-editar-monitor">Contraseña*</label>
                                <input type="password" name="password-editar-monitor" id="password-editar-monitor"><span id="errorPasswordEditar"></span>
                            </div>
                            <div>
                                <label for="dni-editar-monitor">DNI*</label>
                                <input type="text" name="dni-editar-monitor" id="dni-editar-monitor"><span id="errorDniEditar"></span>
                            </div>
                            <div>
                                <label for="telf1-editar-monitor">Teléfono 1*</label>
                                <input type="text" name="telf1-editar-monitor" id="telf1-editar-monitor"><span id="errorPhone1Editar"></span>
                            </div>
                            <div>
                                <label for="telf2-editar-monitor">Teléfono 2</label>
                                <input type="text" name="telf2-editar-monitor" id="telf2-editar-monitor"><span id="errorPhone2Editar"></span>
                            </div>
                            <div>
                                <label for="description-editar-monitor">Descripción*</label>
                                <textarea name="description-editar-monitor" id="description-editar-monitor"></textarea><span id="errorDescriptionEditar"></span>
                            </div>
                            <div>
                                <label for="editar-nombre-grupo">Nombre del grupo*</label>
                                <input name="editar-nombre-grupo" id="editar-nombre-grupo"></input><span id="errorDescriptionEditar"></span>
                            </div>
                        </form>
                        <div class="info-monitor-card">
                            <p>Información Monitor</p>
                            <img class="" src="https://placehold.co/200x200" alt="">
                            <button id="editar-monitor">Guardar Cambios</button>
                            <button id="eliminar-monitor">Eliminar Monitor</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="monitores.js"></script>
</body>

</html>
