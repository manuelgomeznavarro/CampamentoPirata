<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/inscription1.css">
    <title>Inscripción 1</title>
</head>

<body>

    <header>
        <div class="container-logo">
            <img src="../assets/img/logo.png" alt="Logo de la empresa">
        </div>

        <div class="container-pages">
            <ul>
                <li>Programación</li>
                <li>Ubicación</li>
                <li>Precios</li>
                <li>Quienes somos</li>
            </ul>
        </div>

        <div class="container-perfil">
            <img src="" alt="">
        </div>
    </header>

    <div id="registration" value="registration">

        <div class="container-title-inscription">
            <h1> Plazas limitadas: ¡Confirma tu aventura hoy!</h1>
        </div>

        <div class="container-form-inscription">
            <form action="" method="post" class="form-grid">
                <div class="column">
                    <label for="name">Nombre:</label>
                    <br>
                    <input type="text" id="name" name="name">
                    <span name="errorName" id="errorName"></span>

                    <label for="email">Correo electrónico:</label>
                    <br>
                    <input type="email" id="email" name="email">
                    <span name="errorEmail" id="errorEmail"></span>

                    <label for="phone1">Teléfono 1:</label>
                    <br>
                    <input type="tel" id="phone1" name="phone1">
                    <span name="errorPhone1" id="errorPhone1"></span>

                    <label for="city">Ciudad:</label>
                    <br>
                    <input type="text" id="city" name="city">
                    <span name="errorCity" id="errorCity"></span>


                </div>







                <div class="column">
                    <label for="lastName">Apellido:</label>
                    <br>
                    <input type="text" id="lastName" name="lastName"><br><br>
                    <span name="errorLastName" id="errorLastName"></span>

                    <label for="dni">DNI:</label>
                    <br>
                    <input type="text" id="dni" name="dni"><br><br>
                    <span name="errorDni" id="errorDni"></span>

                    <label for="phone2">Teléfono 2:</label>
                    <br>
                    <input type="tel" id="phone2" name="phone2"><br><br>
                    <span name="errorPhone2" id="errorPhone2"></span>

                    <label for="postalCode">Código postal:</label>
                    <br>
                    <input type="text" id="postalCode" name="postalCode"><br><br>
                    <span name="errorPostalCode" id="errorPostalCode"></span>
                </div>









                <input type="submit" id="nextButton" value="Siguiente"></input>

            </form>
        </div>
    </div>

    <script src="../js/inscription1.js"></script>
</body>

</html>
